<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Калькулятор стоимости печати</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js"></script>
</head>
<body>
  <main>
    <h1>Печать на заказ</h1>
    <form id="calc">
      <p>
        <label for="qty">Количество, шт.</label>
        <input type="number" id="qty" name="qty" value="1" min="1" step="1">
      </p>
      <fieldset>
        <legend>Что печатаем</legend>
        <label><input type="radio" name="kind" value="mug" checked>Кружка</label>
        <label><input type="radio" name="kind" value="shirt">Футболка</label>
        <label><input type="radio" name="kind" value="poster">Постер</label>
      </fieldset>
      <p id="opt-box">
        <label for="opt">Материал</label>
        <select id="opt" name="opt"></select>
      </p>
      <p id="prop-box">
        <label><input type="checkbox" id="prop" name="prop">Ламинация (+150 ₽ за штуку)</label>
      </p>
    </form>
    <p class="total" aria-live="polite">Стоимость: <output id="total">0</output> ₽</p>
  </main>
</body>
</html>
